# =============================================================================
# Secrets Detection — TruffleHog
# ISO 27001 A.8.4 / SOC 2 CC6.1 — Credential exposure prevention
# Trigger: push/PR to main
# Scans git history for accidentally committed secrets
# =============================================================================
name: Secrets Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history required for git history scanning
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          # --only-verified: only report confirmed secrets (reduces false positives)
          # --fail: exit with non-zero code if secrets found (blocks PR merge)
          extra_args: --only-verified --fail
