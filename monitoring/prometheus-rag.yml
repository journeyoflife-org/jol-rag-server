# =============================================================================
# Prometheus scrape configuration — JOL RAG Service
# Add to the central Prometheus server's prometheus.yml under scrape_configs.
#
# Target: rag-prod-lt01 (10.40.40.10), VLAN 40
# Metrics: application metrics (:8000/metrics) + node-exporter (:9100)
# =============================================================================

scrape_configs:
  # --- RAG Application Metrics ---
  - job_name: "jol-rag-api"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    static_configs:
      - targets: ["10.40.40.10:8000"]
        labels:
          service: "rag-api"
          environment: "prod"
          region: "lt"
          host: "rag-prod-lt01"
          compliance: "soc2,gdpr,iso27001"

  # --- Node Exporter (already deployed via Ansible monitoring role) ---
  - job_name: "jol-rag-node"
    scrape_interval: 30s
    static_configs:
      - targets: ["10.40.40.10:9100"]
        labels:
          service: "node-exporter"
          environment: "prod"
          region: "lt"
          host: "rag-prod-lt01"

