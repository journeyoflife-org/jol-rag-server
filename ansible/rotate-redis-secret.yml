# =============================================================================
# Ansible playbook — Rotate the Redis password for the RAG stack
#
# The new password enters the pipeline via an Ansible Vault-encrypted vars
# file: ansible/group_vars/rag/vault.yml (variable: vault_redis_password).
# HashiCorp Vault remains the source of truth; the playbook syncs the new
# password there, re-renders /opt/jol/rag/.env via vault-inject-secrets.sh,
# restarts services in dependency order, verifies old-password rejection +
# new-password acceptance, and appends a masked rotation record (SHA256
# fingerprints only) to /var/log/jol-rag/secrets-rotation.log.
#
# Usage:
#   ansible-vault create ansible/group_vars/rag/vault.yml   # one-time setup
#   ansible-vault edit ansible/group_vars/rag/vault.yml     # set new password
#   make rotate-redis                                       # --ask-vault-pass
#
# Prerequisites:
#   - vault CLI installed on rag-prod-lt01 with an active root login
#     (vault login, or VAULT_TOKEN exported in the root environment)
#   - vault CLI >= 1.9 (kv patch reads the JSON payload from stdin)
#
# Emergency mode (HashiCorp Vault unreachable):
#   ansible-playbook -i ansible/inventory/production.yml \
#     ansible/rotate-redis-secret.yml --ask-vault-pass -e skip_vault_sync=true
#   Patches .env directly. Reconciling Vault afterwards is mandatory:
#   vault kv patch secret/data/jol/rag/prod redis_password=...
#
# --check mode: mutating tasks are skipped; verification, audit and fail
# tasks are additionally gated on 'not ansible_check_mode' so a dry run
# never reports a false FAILURE against the un-rotated stack.
#
# SOC 2 CC6.1 / ISO 27001 A.8.24 — credential rotation
# =============================================================================
---
- name: Rotate Redis password on rag-prod-lt01
  hosts: rag-prod-lt01
  become: true
  gather_facts: false

  vars:
    rag_app_dir: /opt/jol/rag
    rag_compose_project: jol-rag
    rag_audit_log_dir: /var/log/jol-rag
    vault_kv_path: secret/data/jol/rag/prod
    vault_addr: "https://vault.jol.internal:8200"
    skip_vault_sync: false
    redis_container: "{{ rag_compose_project }}-redis"
    api_container: "{{ rag_compose_project }}-api"
    worker_container: "{{ rag_compose_project }}-worker"
    rotation_payload: /tmp/.redis-rotation-patch.json

  tasks:
    - name: Verify target host is rag-prod-lt01
      ansible.builtin.assert:
        that:
          - inventory_hostname == "rag-prod-lt01"
          - ansible_host == "10.40.40.10"
        fail_msg: "This playbook must only run against rag-prod-lt01 (10.40.40.10)"
        success_msg: "Target verified: {{ inventory_hostname }} ({{ ansible_host }})"

    - name: Verify new password is defined, strong, and not a placeholder
      ansible.builtin.assert:
        that:
          - vault_redis_password is defined
          - vault_redis_password | length >= 32
          - "'CHANGE_ME' not in vault_redis_password"
          - vault_redis_password is match('^[A-Za-z0-9]+$')
        fail_msg: >-
          vault_redis_password is missing, too short (<32), contains shell-unsafe
          characters, or is a placeholder. Create the encrypted vars file with:
          ansible-vault create ansible/group_vars/rag/vault.yml containing
          'vault_redis_password: <openssl rand -hex 32>' and re-run with
          --ask-vault-pass.

    - name: Record rotation timestamp
      ansible.builtin.set_fact:
        rotation_ts: "{{ '%Y%m%d%H%M%S' | strftime }}"

    - name: Back up current .env (one-command rollback path)
      ansible.builtin.copy:
        src: "{{ rag_app_dir }}/.env"
        dest: "{{ rag_app_dir }}/.env.bak.{{ rotation_ts }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    # --- Capture the current credential (verification only; never logged) ---
    - name: Read current .env
      ansible.builtin.slurp:
        src: "{{ rag_app_dir }}/.env"
      register: env_raw
      no_log: true

    - name: Extract current Redis password
      ansible.builtin.set_fact:
        redis_old_password: >-
          {{ (env_raw.content | b64decode
              | regex_search('^REDIS_PASSWORD=(.+)$', '\\1', multiline=True)
              or [''])[0] }}
      no_log: true

    - name: Fail if the new password equals the current one
      ansible.builtin.assert:
        that:
          - vault_redis_password != redis_old_password
        fail_msg: "New password is identical to the current one — nothing to rotate."
      no_log: true

    # --- Sync the new password into HashiCorp Vault (source of truth) ---
    - name: Verify vault CLI is available
      ansible.builtin.command:
        cmd: vault status
      environment:
        VAULT_ADDR: "{{ vault_addr }}"
      register: vault_status
      changed_when: false
      when: not skip_vault_sync

    # Payload is staged as a 0600 temp file and piped via stdin so the secret
    # never appears in a process argv listing (SOC 2 CC6.1).
    - name: Stage Vault patch payload (0600, shredded after use)
      ansible.builtin.copy:
        content: '{"redis_password": "{{ vault_redis_password }}"}'
        dest: "{{ rotation_payload }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: not skip_vault_sync

    - name: Patch new Redis password into HashiCorp Vault
      ansible.builtin.shell: >
        set -o pipefail;
        vault kv patch {{ vault_kv_path }} - < {{ rotation_payload }}
      args:
        executable: /bin/bash
      environment:
        VAULT_ADDR: "{{ vault_addr }}"
      register: vault_patch
      changed_when: vault_patch.rc == 0
      no_log: true
      when: not skip_vault_sync

    # SECURITY NOTE: shred -u provides logical deletion only.
    # On Proxmox ZFS/LVM-thin, physical blocks may persist in snapshots or
    # COW deltas. The pre-deployment snapshot (pre-rag-deploy-20260807-1959)
    # contains the old credential state; delete or re-key it after the
    # 30-day retention window. Compensating control: the old-password
    # rejection verification below is the true security gate — a recovered
    # payload yields an invalid credential.
    - name: Shred Vault patch payload
      ansible.builtin.command:
        cmd: shred -u {{ rotation_payload }}
      changed_when: true
      when: not skip_vault_sync

    # --- Re-render /opt/jol/rag/.env ---
    - name: Re-render .env from HashiCorp Vault
      ansible.builtin.command:
        cmd: bash {{ rag_app_dir }}/scripts/vault-inject-secrets.sh
        chdir: "{{ rag_app_dir }}"
      changed_when: true
      no_log: true
      when: not skip_vault_sync

    - name: Patch .env directly (emergency mode — Vault unavailable)
      ansible.builtin.lineinfile:
        path: "{{ rag_app_dir }}/.env"
        regexp: '^REDIS_PASSWORD='
        line: "REDIS_PASSWORD={{ vault_redis_password }}"
        owner: root
        group: root
        mode: "0640"
      no_log: true
      when: skip_vault_sync

    # --- Ordered restart: broker first, then its consumers ---
    # Cache and queue failures degrade gracefully (cache.py catches), so the
    # short auth-gap window between container recreations is acceptable.
    - name: Restart redis with the new password
      ansible.builtin.command:
        cmd: docker compose -p {{ rag_compose_project }} up -d --force-recreate redis
        chdir: "{{ rag_app_dir }}"
      changed_when: true

    - name: Wait for redis to become healthy
      ansible.builtin.command:
        cmd: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' {{ redis_container }}
      register: redis_health
      until: redis_health.stdout == "healthy"
      retries: 10
      delay: 3
      changed_when: false

    - name: Restart rag-api with the new REDIS_URL
      ansible.builtin.command:
        cmd: docker compose -p {{ rag_compose_project }} up -d --force-recreate api
        chdir: "{{ rag_app_dir }}"
      changed_when: true

    - name: Wait for rag-api to become healthy
      ansible.builtin.command:
        cmd: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' {{ api_container }}
      register: api_health
      until: api_health.stdout == "healthy"
      retries: 10
      delay: 6
      changed_when: false

    - name: Restart rag-worker with the new REDIS_URL
      ansible.builtin.command:
        cmd: docker compose -p {{ rag_compose_project }} up -d --force-recreate worker
        chdir: "{{ rag_app_dir }}"
      changed_when: true

    - name: Wait for rag-worker to be running (no healthcheck by design)
      ansible.builtin.command:
        cmd: docker inspect --format '{% raw %}{{.State.Status}}{% endraw %}' {{ worker_container }}
      register: worker_state
      until: worker_state.stdout == "running"
      retries: 5
      delay: 2
      changed_when: false

    # --- Verification (compliance evidence) ---
    # Credentials pass via REDISCLI_AUTH, never as redis-cli argv.
    - name: Verify old password is rejected
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ redis_container }}"
          - sh
          - -c
          - "REDISCLI_AUTH={{ redis_old_password }} redis-cli ping"
      register: old_auth
      failed_when: false
      changed_when: false
      no_log: true
      check_mode: false
      when: redis_old_password | length > 0

    - name: Verify new password is accepted
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ redis_container }}"
          - sh
          - -c
          - "REDISCLI_AUTH={{ vault_redis_password }} redis-cli ping"
      register: new_auth
      failed_when: false
      changed_when: false
      no_log: true
      check_mode: false

    - name: Evaluate verification outcome
      ansible.builtin.set_fact:
        rotation_verified: >-
          {{ new_auth.rc == 0
             and 'PONG' in (new_auth.stdout | default(''))
             and ((redis_old_password | length == 0) or (old_auth.rc | default(1)) != 0) }}
      no_log: true

    # --- Masked rotation audit record (fingerprints only, never secrets) ---
    - name: Append rotation record to secrets-rotation.log
      ansible.builtin.lineinfile:
        path: "{{ rag_audit_log_dir }}/secrets-rotation.log"
        create: true
        owner: root
        group: root
        mode: "0640"
        line: >-
          {"timestamp": "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}",
          "action": "redis_password_rotated",
          "actor": "{{ lookup('env', 'USER') or 'ansible' }}",
          "source": "ansible-vault",
          "vault_synced": {{ 'true' if not skip_vault_sync else 'false' }},
          "old_fp": "{{ (redis_old_password | hash('sha256'))[:12] if redis_old_password | length > 0 else 'none' }}",
          "new_fp": "{{ (vault_redis_password | hash('sha256'))[:12] }}",
          "outcome": "{{ 'success' if rotation_verified else 'failure' }}",
          "host": "{{ inventory_hostname }}"}
      no_log: true
      when: not ansible_check_mode

    - name: Rotation evidence summary
      ansible.builtin.debug:
        msg:
          - "Redis rotation outcome: {{ 'SUCCESS' if rotation_verified else 'FAILURE' }}"
          - "Audit evidence: {{ rag_audit_log_dir }}/secrets-rotation.log"
          - "Env backup: {{ rag_app_dir }}/.env.bak.{{ rotation_ts }} — shred after retention review"
          - "Note: shred is logical-only on ZFS/LVM-thin; pre-deployment snapshots retain old blocks until deleted per retention policy"
      when: not ansible_check_mode

    - name: Fail if verification did not pass
      ansible.builtin.fail:
        msg: >-
          Rotation verification failed. Restore {{ rag_app_dir }}/.env.bak.{{ rotation_ts }}
          and re-run, or roll back the VM snapshot (qm rollback).
      when: not ansible_check_mode and not rotation_verified
